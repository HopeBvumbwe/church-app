<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Settings — Church App</title>
	<link rel="stylesheet" href="style.css">
	<style>
		main{max-width:720px;margin:24px auto;padding:0 16px}
		form section{margin:12px 0}
		.actions{display:flex;gap:12px;margin-top:18px}
		button{padding:8px 12px}
	</style>
</head>
<body>
	<header>
		<h1>Settings</h1>
	</header>
	<main>
		<form id="settingsForm">
			<section>
				<label for="notifications">Enable notifications</label>
				<input type="checkbox" id="notifications" name="notifications" checked>
			</section>

			<section>
				<label for="theme">Theme</label>
				<select id="theme" name="theme">
					<option value="light">Light</option>
					<option value="dark">Dark</option>
					<option value="system">System</option>
				</select>
			</section>

			<section>
				<label for="language">Language</label>
				<select id="language" name="language">
					<option value="en">English</option>
					<option value="es">Spanish</option>
					<option value="fr">French</option>
				</select>
			</section>

			<section>
				<label for="textSize">Text size: <span id="textSizeValue">16</span>px</label>
				<input type="range" id="textSize" name="textSize" min="12" max="24" value="16">
			</section>

			<div class="actions">
				<button type="button" id="saveBtn">Save</button>
				<button type="button" id="resetBtn">Reset</button>
			</div>
		</form>
	</main>

	<script src="script.js"></script>
	<script>
		const defaultSettings = {notifications: true, theme: 'system', language: 'en', textSize: 16};
		const el = id => document.getElementById(id);
		function loadSettings(){
			const saved = JSON.parse(localStorage.getItem('settings')||'{}');
			const s = {...defaultSettings, ...saved};
			el('notifications').checked = !!s.notifications;
			el('theme').value = s.theme;
			el('language').value = s.language;
			el('textSize').value = s.textSize;
			el('textSizeValue').textContent = s.textSize;
			document.documentElement.style.fontSize = s.textSize + 'px';
		}
		function saveSettings(){
			const s = {
				notifications: el('notifications').checked,
				theme: el('theme').value,
				language: el('language').value,
				textSize: parseInt(el('textSize').value, 10)
			};
			localStorage.setItem('settings', JSON.stringify(s));
			alert('Settings saved');
			document.documentElement.style.fontSize = s.textSize + 'px';
		}
		function resetSettings(){
			localStorage.removeItem('settings');
			loadSettings();
			alert('Settings reset to defaults');
		}
		el('saveBtn').addEventListener('click', saveSettings);
		el('resetBtn').addEventListener('click', resetSettings);
		el('textSize').addEventListener('input', e => el('textSizeValue').textContent = e.target.value);
		window.addEventListener('DOMContentLoaded', loadSettings);
	</script>
</body>
</html>
